<!DOCTYPE html>
<html lang="th">
<head><link rel="icon" href="assets/beehouse-logo.svg" data-static-favicon="1">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeeHouse Official News | ศูนย์แจ้งเหตุ & ข่าวสารทางการ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #12131c 0%, #0a0a0f 100%);
      --card-bg: rgba(22, 24, 38, 0.85);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-pink: #ff5e97;
      --accent-yellow: #f6ad55;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --radius-pill: 50px;
      --radius-card: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 20px 20px 80px 20px; }

    /* Header Nav */
    .header-news {
      max-width: 1200px;
      margin: 20px auto 30px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      padding: 16px 28px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--glass-border);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 1.2rem; font-weight: 700; }
    .btn-back {
      text-decoration: none;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 20px;
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-back:hover { background: var(--accent-pink); }

    /* Hero Section & Search Bar */
    .hero-section {
      max-width: 1200px;
      margin: 0 auto 28px auto;
      text-align: center;
      padding: 10px 20px;
    }
    .hero-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 12px; }
    .hero-title span { color: var(--accent-pink); }
    .hero-desc { color: var(--text-sub); font-size: 0.95rem; max-width: 600px; margin: 0 auto 24px auto; }

    .search-box {
      max-width: 500px;
      margin: 0 auto;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 14px 24px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent-pink);
      background: rgba(255, 255, 255, 0.12);
    }

    /* 🔥 LATEST BREAKING NEWS BANNER (ส่วนข่าวสารล่าสุด) */
    .latest-news-section {
      max-width: 1200px;
      margin: 0 auto 36px auto;
    }
    .latest-card {
      background: linear-gradient(135deg, rgba(255, 94, 151, 0.15) 0%, rgba(30, 32, 48, 0.9) 100%);
      border: 1px solid rgba(255, 94, 151, 0.4);
      border-radius: var(--radius-card);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
      position: relative;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }
    @media (max-width: 768px) {
      .latest-card { grid-template-columns: 1fr; }
    }
    
    .latest-img-wrapper {
      position: relative;
      min-height: 250px;
      height: 100%;
    }
    .latest-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .latest-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: var(--accent-pink);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      box-shadow: 0 4px 12px rgba(255, 94, 151, 0.5);
      display: flex;
      align-items: center;
      gap: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .latest-content {
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .latest-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }
    .latest-title {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
      color: #fff;
    }
    .latest-excerpt {
      color: var(--text-sub);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* Category Filter Tabs */
    .categories-wrapper {
      max-width: 1200px;
      margin: 0 auto 32px auto;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      justify-content: center;
    }
    .cat-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-sub);
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--accent-pink);
      color: #fff;
      border-color: var(--accent-pink);
    }

    /* News Grid & Cards */
    .section-subtitle {
      max-width: 1200px;
      margin: 0 auto 16px auto;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .news-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 28px;
    }

    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      position: relative;
    }
    .news-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 94, 151, 0.4);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .news-image-wrapper {
      width: 100%;
      height: 190px;
      background: #1e202e;
      position: relative;
      overflow: hidden;
    }
    .news-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .news-card:hover .news-image {
      transform: scale(1.05);
    }

    .priority-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--accent-red);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);
      z-index: 2;
    }

    .news-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .news-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .news-tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
    }
    .tag-drama { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
    .tag-blacklist { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px dashed var(--accent-red); }
    .tag-game { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
    .tag-roleplay { background: rgba(246, 173, 85, 0.15); color: var(--accent-yellow); }
    .tag-security { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }

    .news-date { font-size: 0.8rem; color: var(--text-sub); }
    .news-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 10px; line-height: 1.4; }
    .news-excerpt { font-size: 0.88rem; color: var(--text-sub); line-height: 1.6; margin-bottom: 20px; flex-grow: 1; }
    
    .news-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.82rem;
    }
    .news-author { color: var(--text-sub); }
    
    .btn-read-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-read-more:hover {
      background: var(--accent-pink);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Header Nav -->
  <header class="header-news">
    <div class="brand">
      <span>📢</span> BeeHouse Official Newsroom
    </div>
    <a href="index.html" class="btn-back">← กลับหน้าหลัก BeeHouse</a>
  </header>

  <!-- Hero Banner & Search -->
  <section class="hero-section">
    <h1 class="hero-title">ศูนย์แจ้งเหตุ <span>& ข่าวสารทางการ</span></h1>
    <p class="hero-desc">เกาะติดข่าวสารอัปเดต Minecraft Bedrock, โฟกัสความปลอดภัย, สรุปประเด็นดราม่า และตรวจสอบรายชื่อแบล็กลิสต์อันตราย</p>
    
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 ค้นหาข่าวสาร, ชื่อผู้ใช้อันตราย, หรือหัวข้อ..." oninput="handleSearch()">
    </div>
  </section>

  <!-- 🔥 ส่วนข่าวสารล่าสุด (Latest Breaking News) -->
  <section class="latest-news-section" id="latest-news-container"></section>

  <!-- Category Filter Buttons -->
  <div class="categories-wrapper">
    <button class="cat-btn active" onclick="filterNews('all', this)">🌐 ทั้งหมด</button>
    <button class="cat-btn" onclick="filterNews('blacklist', this)">🚫 แบล็กลิสต์ & โกงเงิน</button>
    <button class="cat-btn" onclick="filterNews('security', this)">🛡️ ความปลอดภัยไซเบอร์</button>
    <button class="cat-btn" onclick="filterNews('game', this)">🎮 อัปเดต Minecraft Bedrock</button>
    <button class="cat-btn" onclick="filterNews('roleplay', this)">🎭 อัปเดต Roleplay / Project</button>
    <button class="cat-btn" onclick="filterNews('drama', this)">☕ ดราม่า & ชุมชน</button>
  </div>

  <div class="section-subtitle">📑 รายการข่าวสารทั้งหมด</div>

  <!-- News Cards Grid Container -->
  <main class="news-grid" id="news-container"></main>

  <script>
    // ===================================================
    // ข้อมูลข่าวสาร (เรียงลำดับจากข่าวใหม่สุดอยู่ด้านบน)
    // ===================================================
    const newsData = [
      {
        id: 1,
        title: 'เตือนภัยขั้นสูง! พบผู้ใช้ดิสคอร์ดหลอกขายสคริปต์ Bedrock ปลอม',
        category: 'blacklist',
        categoryName: '🚫 แบล็กลิสต์',
        date: '05 ก.ย. 2026',
        image: 'https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&w=800&q=80',
        isUrgent: true,
        excerpt: 'ตรวจสอบพบรายชื่อผู้ใช้งาน Discord แอบอ้างนำสคริปต์แจกฟรีมาหลอกขายในราคาแพง โดยโอนเงินแล้วทำการบล็อกหนีทันที ตรวจสอบรายชื่อบัญชีธนาคารและ ID ได้ที่นี่...',
        author: 'ศูนย์แจ้งเหตุ BeeHouse',
        linkUrl: 'https://discord.gg/your-blacklist-channel'
      },
      {
        id: 2,
        title: 'วิธีตั้งค่าป้องกันบัญชี Discord จากการโดนฉก Token ผ่าน Bot แปลกหน้า',
        category: 'security',
        categoryName: '🛡️ ความปลอดภัย',
        date: '04 ก.ย. 2026',
        image: 'https://images.unsplash.com/photo-1614064641938-3bbee52942c7?auto=format&fit=crop&w=800&q=80',
        isUrgent: false,
        excerpt: 'แนะแนวทางการตั้งค่าการยืนยันตัวตน 2 ปัจจัย (2FA) และข้อควรระวังเมื่อมีคนส่งลิงก์ทดสอบเกมหรือลิงก์ยืนยันตัวตนแปลกหน้า เพื่อป้องกันบัญชีสูญหาย',
        author: 'ทีมงานความปลอดภัย',
        linkUrl: 'https://support.discord.com'
      },
      {
        id: 3,
        title: 'อัปเดตใหญ่ Minecraft Bedrock Preview Script API v1.14.0',
        category: 'game',
        categoryName: '🎮 อัปเดตเกม',
        date: '03 ก.ย. 2026',
        image: 'https://images.unsplash.com/photo-1627856013091-fed6e4e30025?auto=format&fit=crop&w=800&q=80',
        isUrgent: false,
        excerpt: 'Mojang ปล่อยอัปเดตตัวเลือก Script API ใหม่ เพิ่มฟังก์ชันจัดการ Custom Entity, Item Event และลดอาการกระตุกของเซิร์ฟเวอร์ขนาดใหญ่ได้อย่างมีประสิทธิภาพ',
        author: 'BeeHouse Modder Team',
        linkUrl: 'https://feedback.minecraft.net'
      },
      {
        id: 4,
        title: 'ความคืบหน้าการพัฒนาระบบเซิร์ฟเวอร์ MingYue Roleplay',
        category: 'roleplay',
        categoryName: '🎭 อัปเดต Roleplay',
        date: '01 ก.ย. 2026',
        image: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80',
        isUrgent: false,
        excerpt: 'เผยภาพตัวอย่างระบบกระเป๋าเดินทางใหม่และระบบอาชีพภายในโปรเจกต์ MingYue พร้อมประกาศเตรียมเปิดรับทดสอบรอบ Closed Beta เร็วๆ นี้...',
        author: 'MingYue Dev Team',
        linkUrl: '#home'
      }
    ];

    let currentCategory = 'all';
    async function loadAdminNews(){
      try{ if(window.BeeHouseCMS){ const s=await window.BeeHouseCMS.get(); if(Array.isArray(s.news)) return s.news; } }catch(e){}
      return newsData;
    }


    // ฟังก์ชันเรนเดอร์ "ข่าวสารล่าสุด (Latest News)"
    function renderLatestNews() {
      const container = document.getElementById('latest-news-container');
      if (!newsData || newsData.length === 0) return;

      // ดึงข่าวสารลำดับแรกสุด (index 0)
      const latest = newsData[0];

      container.innerHTML = `
        <div class="latest-card">
          <div class="latest-img-wrapper">
            <span class="latest-badge">🔥 NEW ข่าวล่าสุด</span>
            <img src="${latest.image}" alt="${latest.title}" class="latest-img" onerror="this.src='https://via.placeholder.com/800x400/12131c/ffffff?text=BeeHouse+Latest+News'">
          </div>
          <div class="latest-content">
            <div class="latest-meta">
              <span class="news-tag tag-${latest.category}">${latest.categoryName}</span>
              <span class="news-date">📅 ${latest.date}</span>
            </div>
            <h2 class="latest-title">${latest.title}</h2>
            <p class="latest-excerpt">${latest.excerpt}</p>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span class="news-author">✍️ ${latest.author}</span>
              ${latest.linkUrl ? `<a href="${latest.linkUrl}" target="_blank" rel="noopener noreferrer" class="btn-read-more" style="padding: 8px 18px;">อ่านรายละเอียดเพิ่มเติม ↗</a>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // ฟังก์ชันเรนเดอร์การ์ดข่าวสารใน Grid
    function renderNews(items) {
      const container = document.getElementById('news-container');
      
      if (items.length === 0) {
        container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 60px 0;">ไม่พบข้อมูลข่าวสารหรือรายการแจ้งเหตุที่คุณค้นหา</p>`;
        return;
      }

      container.innerHTML = items.map(news => `
        <article class="news-card">
          ${news.isUrgent ? `<div class="priority-badge">🚨 แจ้งเตือนด่วน</div>` : ''}
          
          <div class="news-image-wrapper">
            <img src="${news.image}" alt="${news.title}" class="news-image" loading="lazy" onerror="this.src='https://via.placeholder.com/800x400/12131c/ffffff?text=BeeHouse+News'">
          </div>

          <div class="news-content">
            <div class="news-meta">
              <span class="news-tag tag-${news.category}">${news.categoryName}</span>
              <span class="news-date">${news.date}</span>
            </div>
            
            <h2 class="news-title">${news.title}</h2>
            <p class="news-excerpt">${news.excerpt}</p>
            
            <div class="news-footer">
              <span class="news-author">✍️ ${news.author}</span>
              ${news.linkUrl ? `<a href="${news.linkUrl}" target="_blank" rel="noopener noreferrer" class="btn-read-more">อ่านรายละเอียด ↗</a>` : ''}
            </div>
          </div>
        </article>
      `).join('');
    }

    function filterNews(category, btnElement) {
      currentCategory = category;
      
      const buttons = document.querySelectorAll('.cat-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      applyFilterAndSearch();
    }

    function handleSearch() {
      applyFilterAndSearch();
    }

    function applyFilterAndSearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = newsData.filter(item => {
        const matchesCategory = (currentCategory === 'all') || (item.category === currentCategory);
        const matchesSearch = item.title.toLowerCase().includes(query) || 
                              item.excerpt.toLowerCase().includes(query) || 
                              item.author.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      renderNews(filtered);
    }

    window.addEventListener('DOMContentLoaded', async () => { const x=await loadAdminNews(); newsData.splice(0,newsData.length,...x); renderLatestNews(); renderNews(newsData); });
  </script>
  <script src="dynamic.js"></script>
<script src="site-default.js"></script><script src="cms.js"></script>
</body>
</html>
